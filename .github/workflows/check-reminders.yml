name: Check medication reminders

# بيشتغل لما حد (cron-job.org) يبعت طلب "repository_dispatch" بنوع "check-reminders"
# بدل الاعتماد على "schedule" العادية في GitHub اللي ممكن تتأخر أو تتجاهل.
on:
  repository_dispatch:
    types: [check-reminders]
  workflow_dispatch: {} # يسمح كمان بتشغيله يدويًا من تاب Actions للتجربة

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: functions
        run: npm install --omit=dev

      - name: Run reminder check
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: node check-reminders.js
